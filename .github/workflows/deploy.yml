name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::Missing DEPLOY_SSH_KEY secret"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -eu

            cd /home/deploy/portfolio

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker network inspect shared-nginx >/dev/null 2>&1 || docker network create shared-nginx
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml ps
